name: Validate and publish image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t innovation-test:${{ github.sha }} .
      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --name innovation-test -p 127.0.0.1:38177:3000 innovation-test:${{ github.sha }}
          trap 'docker logs innovation-test || true; docker stop innovation-test || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:38177/api >/dev/null; then break; fi
            sleep 1
          done
          docker exec innovation-test deno eval "const r = await fetch('http://127.0.0.1:3000/api'); if (!r.ok) Deno.exit(1)"
          curl -fsS http://127.0.0.1:38177/ >/dev/null
          curl -fsS http://127.0.0.1:38177/images/es6.gif >/dev/null
          curl -fsS http://127.0.0.1:38177/api/innovation-days | python3 -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data,list) and len(data)>0'
      - name: Publish commit-tagged image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:sha-${REVISION}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag "innovation-test:${REVISION}" "$image"
          docker push "$image"
